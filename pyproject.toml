[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planj"
version = "0.1.0"
description = "Personal behaviour forecasting — local-first"
requires-python = ">=3.12"
dependencies = [
    "icalendar>=6",
    "recurring-ical-events>=3",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
planj = "planj.cli:main"

[tool.setuptools.packages.find]
include = ["planj*"]
